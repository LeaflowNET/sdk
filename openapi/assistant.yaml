info:
  description: |-
    控制台里的 AI 助手：对话、消息、工具调用与审批、附件，以及把助手接到微信、飞书、Telegram 等即时通讯平台上。

    ## 一次对话

    1. `POST /v1/threads` 创建对话；
    2. `POST /v1/threads/{thread}/messages` 发送消息，立即返回 `turnId`，助手的执行在后台进行；
    3. `GET /v1/threads/{thread}` 取回对话文档用于渲染，并按其中的 `stream` 连上实时输出；
    4. 助手需要用户参与时，文档中的 `wait` 会说明是哪一种：审批一批工具调用（`POST /v1/threads/{thread}/approvals/{batch}`），或回答几个问题（`POST /v1/threads/{thread}/questions/{item}`）。处理完成后助手自动继续。

    发送图片分两步：先 `POST /v1/attachments` 上传拿到 id，发送消息时放进 `attachmentIds`。

    ## 实时输出

    ```
    GET /v1/turns/{turn}/stream?ticket=<ticket>&cursor=<cursor>
    ```

    这是一条 Server-Sent Events 流，因此不在下方的接口列表中。

    - `path` 与 `ticket` 都取自对话文档的 `stream`。`path` 是相对路径，按取回文档的地址解析；
    - `cursor` 是起始位置，取自对话文档的 `cursor`。不传则从可用范围的开头开始；
    - 推送的每一条都是对那份对话文档的一次增量编辑，套用同一套渲染逻辑即可；
    - 连接有生存期，到时会正常关闭。使用 `EventSource` 时浏览器会自动携带 `Last-Event-ID` 重连并从断点续传，无需额外处理；
    - 三种结束事件：`done` 本次 turn 完成（附带最终状态）、`paused` 助手在等待用户处理（重新取回对话文档读 `wait`）、`stalled` 执行已中断且不会恢复，不要重连。
  title: Leaflow Assistant 用户 API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/attachments:
    post:
      description: 请求体直接是文件字节，不使用 multipart 封装，一次上传一个文件。类型由内容判定，与 Content-Type 无关。返回的 id 在发送消息时放进 attachmentIds；从未被任何消息引用的附件会被定期清除。
      operationId: upload-attachment
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedView"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 上传图片
      tags:
        - Attachment
  /v1/attachments/{attachment}:
    get:
      description: 按附件 id 取回原始字节，可直接作为 <img> 的地址使用。响应带长期缓存头，附件内容不会变化。附件不存在或不属于当前用户时返回 404。
      operationId: download-attachment
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
        - in: path
          name: attachment
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 取回图片
      tags:
        - Attachment
  /v1/bindings:
    get:
      operationId: list-bindings
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: platform
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBindingsOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出绑定
      tags:
        - Onboarding
  /v1/bindings/{binding}:
    delete:
      operationId: delete-binding
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
        - in: path
          name: binding
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 解除绑定
      tags:
        - Onboarding
  /v1/channels:
    get:
      operationId: list-channels
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: platform
          schema:
            type: string
        - description: 仅返回处于启用状态的通道
          explode: false
          in: query
          name: active
          schema:
            description: 仅返回处于启用状态的通道
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出通道
      tags:
        - Onboarding
    post:
      operationId: create-channel
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelView"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 创建通道
      tags:
        - Onboarding
  /v1/channels/{channel}:
    delete:
      description: 删除后该通道不再接收入站消息，其上的绑定一并失效。项目处于停服或清理状态时本接口仍然可用。
      operationId: delete-channel
      parameters:
        - description: Bearer + 项目令牌。一张项目令牌同时确定当前用户和当前项目，因此路径上不带 project_id
          in: header
