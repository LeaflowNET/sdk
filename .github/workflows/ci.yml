# The openapi/ directory is populated by each service's release pipeline.
#
# dist/ is committed, because consumers install this package straight from git and
# get whatever the tree holds. That makes the build a thing the repository has to
# keep true: a spec sync that touches openapi/ alone leaves dist/ describing the
# previous contract, and nothing fails — the client simply lacks the endpoints the
# document promises. So main rebuilds and commits it.
#
# Publishing runs only on a tag, so the version number stays a deliberate choice;
# this package aggregates several services.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # On a pull request there is nothing to push to, and a build that fails is
      # the answer being looked for anyway.
      - if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain dist src/generated)" ]; then
            git config user.name  'leaflow-sdk-bot'
            git config user.email 'sdk-bot@leaflow.net'
            git add dist src/generated
            git commit -m "build: rebuild dist from openapi/"
            git push
          fi

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing wants it.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The version comes from the tag rather than package.json.
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm publish --provenance
